version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --legacy-peer-deps
    build:
      commands:
        - npm run typecheck
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
